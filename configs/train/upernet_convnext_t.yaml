# UPerNet with a ConvNeXt-Tiny encoder (timm, ImageNet). lr 1e-4 as for SegFormer.
name: upernet_convnext_t
seed: 42

data:
  manifest: data/processed/openearthmap/manifest.csv
  crop_size: 384
  batch_size: 8
  num_workers: 4

model:
  arch: upernet
  encoder: tu-convnext_tiny
  encoder_weights: imagenet

loss:
  type: ce_dice
  ce_weight: 1.0
  dice_weight: 1.0
  class_weights: configs/class_weights.yaml
  weight_power: 0.5

train:
  epochs: 15
  lr: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 1
  min_lr: 0.000001
  grad_clip: 1.0
  amp: auto
  early_stop_patience: 5
  min_delta: 0.001
  log_every: 100
  device: auto
