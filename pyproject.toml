[project]
name = "parsel"
version = "0.1.0"
description = "Land-use semantic segmentation for high-resolution satellite imagery"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "albumentations>=2.0.8",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0.3",
    "rasterio>=1.4.4",
    "segmentation-models-pytorch>=0.5.0",
    "tensorboard>=2.21.0",
    "timm>=1.0.30",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parsel"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]  # shell commands in notebooks cannot be wrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
